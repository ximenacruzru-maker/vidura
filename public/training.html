<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ironwood Operations — Classroom Prototype</title>
<script>
  // Follow the app's colour theme (saved by the app in this browser); refresh if it changes in another tab or the app.
  (function(){ function apply(){ try { var l = JSON.parse(localStorage.getItem('declara_look_v2') || '{}'); document.documentElement.setAttribute('data-theme', l.theme || 'talavera') } catch (e) {} }
    apply(); window.addEventListener('storage', apply); })();
</script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Merriweather:wght@700;900&display=swap');

  :root{
    --ink:#164fec;
    --sub:#23348a;
    --line:#dbe9f7;
    --bg:#eefaff;
    --card:#FFFFFF;
    --brass:#164fec;
    --brass-dark:#1a4be6;
    --track:#E8EFFA;
    --active-bg:#e8f1ff;
    --active-border:#B9C8FF;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit; text-decoration:none;}

  /* ---------- TOP BAR ---------- */
  .topbar{
    background:var(--card);
    border-bottom:1px solid var(--line);
  }
  .topbar-inner{
    max-width:1080px; margin:0 auto;
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 20px;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-mark{
    width:30px;height:30px;border-radius:7px;
    background:linear-gradient(135deg,var(--brass),var(--brass-dark));
    display:flex;align-items:center;justify-content:center;
    color:#fff; font-weight:800; font-size:13px;
  }
  .brand-name{font-weight:700; font-size:14.5px;}
  .brand-sub{font-size:11px; color:var(--sub);}

  .tabs{display:flex; gap:22px; font-size:13px; color:var(--sub);}
  .tabs .active{color:var(--ink); font-weight:600; position:relative;}
  .tabs .active::after{
    content:""; position:absolute; left:0; right:0; bottom:-13px; height:2px; background:var(--ink);
  }
  .tabs span{display:none;}
  @media(min-width:640px){ .tabs span{display:inline;} }

  .ai-banner{
    background:linear-gradient(90deg,#e8f1ff,#F0F0F8);
    border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; gap:12px;
    padding:9px 16px; font-size:12.5px; flex-wrap:wrap; text-align:center;
  }
  .ai-banner b{color:var(--brass-dark);}
  .ai-pill{
    background:var(--ink); color:#fff; font-size:11.5px; font-weight:600;
    padding:6px 12px; border-radius:20px; white-space:nowrap;
  }

  /* ---------- GRID VIEW ---------- */
  #gridView{max-width:1080px; margin:0 auto; padding:22px 20px 60px;}
  .grid-head{margin-bottom:16px;}
  .grid-head h1{font-size:19px; margin:0 0 4px;}
  .grid-head p{font-size:12.5px; color:var(--sub); margin:0;}

  .grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:18px;
  }
  @media(max-width:800px){ .grid{grid-template-columns:repeat(2,1fr);} }
  @media(max-width:520px){ .grid{grid-template-columns:1fr;} }

  .mcard{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    overflow:hidden;
    cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .mcard:hover{transform:translateY(-2px); box-shadow:0 8px 20px rgba(28,23,16,0.08);}
  .thumb{
    height:110px;
    display:flex; align-items:center; justify-content:center;
    position:relative;
    color:#fff;
  }
  .thumb.has-cover{
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
  }
  .thumb.has-cover::before{
    content:'';
    position:absolute; inset:0;
    background:rgba(17,62,167,0.52);
  }
  .thumb.has-cover .tnum,
  .thumb.has-cover .tlabel{ position:relative; z-index:1; }
  .thumb.has-cover .tlabel{ text-shadow:0 1px 3px rgba(0,0,0,.45); }
  .thumb .tlabel{
    font-family:'Inter',sans-serif; font-weight:800; font-size:12px;
    letter-spacing:.06em; text-transform:uppercase; text-align:center; padding:0 12px;
    opacity:.92;
  }
  .thumb .tnum{
    position:absolute; top:8px; left:10px; font-size:10.5px; font-weight:700;
    background:rgba(0,0,0,0.28); padding:2px 7px; border-radius:5px; letter-spacing:.04em;
  }
  .mbody{padding:12px 14px 14px;}
  .mtitle{font-size:13.5px; font-weight:700; margin-bottom:3px;}
  .mdesc{font-size:11.5px; color:var(--sub); line-height:1.4; margin-bottom:10px; min-height:30px;}
  .ptrack{height:6px; background:var(--track); border-radius:4px; overflow:hidden; margin-bottom:4px;}
  .pfill{height:100%; background:var(--brass);}
  .ppct{font-size:10px; color:var(--sub); font-weight:600;}
  .locked-badge{
    font-size:9.5px; color:var(--sub); font-weight:600;
    display:flex; align-items:center; gap:4px;
  }

  /* ---------- CLASSROOM VIEW ---------- */
  #classView{display:none;}
  .class-wrap{
    max-width:1080px; margin:0 auto; padding:20px 20px 60px;
    display:flex; gap:22px; align-items:flex-start;
  }
  @media(max-width:760px){ .class-wrap{flex-direction:column;} }

  .back-row{max-width:1080px; margin:14px auto 0; padding:0 20px;}
  .back-btn{
    font-size:12.5px; color:var(--sub); display:inline-flex; align-items:center; gap:6px;
    cursor:pointer;
  }
  .back-btn:hover{color:var(--ink);}

  .sidebar{
    width:270px; flex:none;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px;
  }
  @media(max-width:760px){ .sidebar{width:100%;} }

  .side-eyebrow{font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--sub); font-weight:700; margin-bottom:8px;}
  .side-progress-row{display:flex; align-items:center; gap:8px; margin-bottom:14px;}
  .side-pct{
    background:var(--brass); color:#fff; font-size:10.5px; font-weight:700;
    padding:3px 8px; border-radius:20px; flex:none;
  }
  .side-track{flex:1; height:6px; background:var(--track); border-radius:4px; overflow:hidden;}
  .side-fill{height:100%; background:var(--brass);}

  .lesson-item{
    display:flex; align-items:center; gap:8px;
    padding:9px 8px; border-radius:7px;
    font-size:12.5px; cursor:pointer; color:var(--ink);
    margin-bottom:2px;
  }
  .lesson-item:hover{background:var(--paper);}
  .lesson-item.active{background:var(--active-bg); border:1px solid var(--active-border); font-weight:600;}
  .lesson-check{
    width:15px;height:15px; border-radius:50%; border:1.5px solid #B4C2DA; flex:none;
    display:flex; align-items:center; justify-content:center; font-size:9px; color:#fff;
  }
  .lesson-check.done{background:var(--brass); border-color:var(--brass);}
  .lesson-tagmini{
    font-size:9px; color:var(--sub); margin-left:auto; flex:none; text-transform:uppercase; letter-spacing:.03em;
  }

  .content{flex:1; min-width:0;}
  .content-card{
    background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden;
  }
  .content-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 18px; border-bottom:1px solid var(--line);
  }
  .content-title{font-size:15px; font-weight:700;}
  .complete-circle{
    width:24px;height:24px;border-radius:50%; border:1.5px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--sub);
    cursor:pointer; flex:none;
  }
  .complete-circle.done{background:var(--brass); border-color:var(--brass); color:#fff;}

  .video-box{
    margin:16px 18px 0;
    background:#8A8AA8;
    border-radius:8px;
    height:280px;
    display:flex; align-items:center; justify-content:center;
    position:relative;
  }
  @media(max-width:520px){ .video-box{height:180px;} }
  .play-btn{
    width:56px;height:56px;border-radius:50%;
    background:rgba(255,255,255,0.9);
    display:flex; align-items:center; justify-content:center;
    font-size:20px; color:var(--ink);
  }
  .video-tag{
    position:absolute; bottom:10px; left:10px;
    background:rgba(0,0,0,0.45); color:#fff; font-size:10px; padding:3px 8px; border-radius:5px;
  }

  .content-body{padding:16px 18px 20px;}
  .content-desc{font-size:13px; color:var(--gray); line-height:1.6; margin-bottom:16px;}
  .content-tags{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:18px;}
  .lesson-link{display:inline-flex;align-items:center;gap:8px;margin:0 0 16px;padding:11px 17px;
    border-radius:10px;background:var(--mid);color:#fff;font-weight:700;font-size:14px;text-decoration:none}
  .lesson-link:hover{background:var(--bistre)}
  .lesson-host{font-weight:500;font-size:12px;opacity:.8}
  .lesson-ext{margin-left:6px;font-size:11px;opacity:.65}
  .ctag{
    font-size:10px; text-transform:uppercase; letter-spacing:.04em; font-weight:700;
    padding:4px 8px; border-radius:5px; background:var(--paper); color:var(--brass-dark);
    border:1px solid var(--line);
  }
  .nav-row{display:flex; justify-content:space-between; gap:10px; padding-top:14px; border-top:1px solid var(--line);}
  .nav-btn{
    font-size:12.5px; font-weight:600; padding:9px 14px; border-radius:7px; cursor:pointer;
    border:1px solid var(--line); background:var(--card); color:var(--ink);
  }
  .nav-btn.primary{background:var(--ink); color:#fff; border-color:var(--ink);}
  .nav-btn[disabled]{opacity:.35; cursor:default;}

  /* ===== Talavera: module cards as painted tiles (cobalt frame and fan corners, a cobalt week tab, a terracotta
     panel, the title on a cobalt band, a terracotta progress bar) ===== */
  html[data-theme="talavera"]{ --ink:#1B2A6B; --sub:#5E4C3A; --line:#E6D3B6; --bg:#F6EBD6; --card:#FBF4E6; --brass:#C8692F; --brass-dark:#B4461E;
    --track:#F1DFC2; --active-bg:#F1DFC2; --active-border:#23359A; }
  html[data-theme="talavera"] body{ background:radial-gradient(ellipse at 30% 0,#FBF3E3,transparent 60%),var(--bg); }
  html[data-theme="talavera"] .grid-head h1{ font-family:'Merriweather',Georgia,serif; font-weight:900; font-size:24px; color:#1B2A6B; }
  html[data-theme="talavera"] .grid{ gap:22px; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); }
  html[data-theme="talavera"] .mcard{ position:relative; background:#FBF4E6; border:1px solid transparent; border-radius:0; overflow:visible;
    border-image:url('talavera-frame.png') 118 fill / 34px / 0 stretch; padding:30px 24px 24px; background:none; filter:drop-shadow(0 5px 7px rgba(90,45,15,.25)); }
  html[data-theme="talavera"] .mcard:hover{ transform:translateY(-3px); box-shadow:none; filter:drop-shadow(0 9px 12px rgba(90,45,15,.3)); }
  html[data-theme="talavera"] .thumb, html[data-theme="talavera"] .thumb.has-cover{ height:96px; border-radius:6px 6px 0 0; margin:8px 0 0;
    background:radial-gradient(ellipse at 40% 35%,#E09A6B,#C8692F 70%,#B85A27) !important; box-shadow:inset 0 0 0 2px rgba(255,246,232,.35); }
  html[data-theme="talavera"] .thumb.has-cover::before{ display:none; }
  html[data-theme="talavera"] .thumb .tlabel{ display:none; }
  html[data-theme="talavera"] .thumb .tnum, html[data-theme="talavera"] .thumb.has-cover .tnum{ position:absolute; top:-20px; left:50%; transform:translateX(-50%); white-space:nowrap; background:#23359A; color:#FFF6E8;
    font-family:'Merriweather',Georgia,serif; font-size:12.5px; font-weight:700; letter-spacing:.02em; padding:5px 14px 6px; border-radius:6px;
    box-shadow:0 0 0 2px #FBF4E6; text-transform:none; }
  html[data-theme="talavera"] .mbody{ padding:0; text-align:center; }
  html[data-theme="talavera"] .mtitle{ background:#23359A; color:#FFF6E8; font-family:'Merriweather',Georgia,serif; font-weight:700; font-size:14px;
    line-height:1.3; padding:9px 10px; margin:0 0 10px; border-radius:0 0 6px 6px; box-shadow:inset 0 -2px 0 rgba(0,0,0,.18); }
  html[data-theme="talavera"] .mdesc{ color:#3A3150; font-size:11.5px; padding:0 4px; }
  html[data-theme="talavera"] .ptrack{ height:9px; margin:0 10px 4px; background:#F6EBD6; border:1.5px solid #C8692F; border-radius:6px; }
  html[data-theme="talavera"] .pfill{ background:linear-gradient(#D9793F,#B4461E); border-radius:4px; }
  html[data-theme="talavera"] .ppct{ color:#6E5B48; }
</style>
</head>
<body>

<!-- ======================= GRID VIEW ======================= -->
<div id="gridView">
  <div class="grid-head">
    <h1>Classroom</h1>
    <p>Tap any module to open its lessons.</p>
  </div>
  <div class="grid" id="gridContainer"></div>
</div>

<!-- ======================= CLASSROOM VIEW ======================= -->
<div class="back-row" id="backRow" style="display:none;">
  <div class="back-btn" onclick="showGrid()">← Back to Classroom</div>
</div>

<div id="classView">
  <div class="class-wrap">
    <div class="sidebar">
      <div class="side-eyebrow" id="sideEyebrow">MODULE</div>
      <div class="side-progress-row">
        <span class="side-pct" id="sidePct">0%</span>
        <div class="side-track"><div class="side-fill" id="sideFill" style="width:0%"></div></div>
      </div>
      <div id="lessonList"></div>
    </div>

    <div class="content">
      <div class="content-card">
        <div class="content-head">
          <div class="content-title" id="lessonTitle">—</div>
          <div class="complete-circle" id="completeCircle" onclick="toggleComplete()">✓</div>
        </div>
        <div class="video-box">
          <div class="play-btn">▶</div>
          <div class="video-tag">Video placeholder</div>
        </div>
        <div class="content-body">
          <p class="content-desc" id="lessonDesc">—</p>
          <div id="lessonLink"></div>
          <div class="content-tags" id="lessonTags"></div>
          <div class="nav-row">
            <button class="nav-btn" id="prevBtn" onclick="stepLesson(-1)">← Previous</button>
            <button class="nav-btn primary" id="nextBtn" onclick="stepLesson(1)">Next →</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

const colors = ['#164fec','#1B4BC0','#1a4be6','#4d60ff','#164fec','#1B4BC0','#164fec','#1a4be6','#4d60ff','#1B4BC0','#164fec','#164fec','#1a4be6'];

let currentModule = null;
let currentLesson = 0;
const completed = {};

function renderGrid(){
  const grid = document.getElementById('gridContainer');
  grid.innerHTML = '';
  modules.forEach((m, i) => {
    const card = document.createElement('div');
    card.className = 'mcard';
    card.onclick = () => openModule(m.key);
    card.innerHTML = `
      <div class="thumb${m.cover ? ' has-cover' : ''}" style="${m.cover ? `background-image:url('${m.cover}')` : `background:${colors[i % colors.length]}`}">
        <div class="tnum">${m.num}</div>
        <div class="tlabel">${m.title}</div>
      </div>
      <div class="mbody">
        <div class="mtitle">${m.title}</div>
        <div class="mdesc">${m.desc}</div>
        <div class="ptrack"><div class="pfill" style="width:${m.progress}%"></div></div>
        <div class="ppct">${m.progress}% complete</div>
      </div>`;
    grid.appendChild(card);
  });
}

function openModule(key){
  currentModule = modules.find(m => m.key === key);
  currentLesson = 0;
  document.getElementById('gridView').style.display = 'none';
  document.getElementById('classView').style.display = 'block';
  document.getElementById('backRow').style.display = 'block';
  document.getElementById('sideEyebrow').textContent = currentModule.num + ' · ' + currentModule.title;
  renderSidebar();
  renderLesson();
  window.scrollTo(0,0);
}

function showGrid(){
  document.getElementById('gridView').style.display = 'block';
  document.getElementById('classView').style.display = 'none';
  document.getElementById('backRow').style.display = 'none';
  window.scrollTo(0,0);
}

function renderSidebar(){
  const list = document.getElementById('lessonList');
  list.innerHTML = '';
  currentModule.lessons.forEach((l, i) => {
    const row = document.createElement('div');
    row.className = 'lesson-item' + (i === currentLesson ? ' active' : '');
    const key = currentModule.key + '-' + i;
    const done = completed[key];
    row.innerHTML = `
      <span class="lesson-check ${done ? 'done' : ''}">${done ? '✓' : ''}</span>
      <span>${l.t}${l.u ? '<span class="lesson-ext" title="Opens an external lesson">&#8599;</span>' : ''}</span>
      <span class="lesson-tagmini">${l.tags[0]}</span>`;
    row.onclick = () => { currentLesson = i; renderSidebar(); renderLesson(); };
    list.appendChild(row);
  });
  updateSideProgress();
}

function updateSideProgress(){
  const total = currentModule.lessons.length;
  let done = 0;
  currentModule.lessons.forEach((l,i) => { if(completed[currentModule.key+'-'+i]) done++; });
  const pct = Math.round((done/total)*100);
  document.getElementById('sidePct').textContent = pct + '%';
  document.getElementById('sideFill').style.width = pct + '%';
}

function renderLesson(){
  const l = currentModule.lessons[currentLesson];
  document.getElementById('lessonTitle').textContent = l.t;
  document.getElementById('lessonDesc').textContent = l.d;
  const key = currentModule.key + '-' + currentLesson;
  const circle = document.getElementById('completeCircle');
  circle.className = 'complete-circle' + (completed[key] ? ' done' : '');

  const linkWrap = document.getElementById('lessonLink');
  linkWrap.innerHTML = l.u
    ? `<a class="lesson-link" href="${l.u}" target="_blank" rel="noopener noreferrer">Open lesson`+
      `<span class="lesson-host">${l.ul || ''}</span><span aria-hidden="true">&#8599;</span></a>`
    : '';

  const tagWrap = document.getElementById('lessonTags');
  tagWrap.innerHTML = l.tags.map(t => `<span class="ctag">${t}</span>`).join('');

  document.getElementById('prevBtn').disabled = currentLesson === 0;
  document.getElementById('nextBtn').disabled = currentLesson === currentModule.lessons.length - 1;
  document.getElementById('nextBtn').textContent = currentLesson === currentModule.lessons.length - 1 ? 'Last lesson' : 'Next →';
}

function stepLesson(dir){
  const next = currentLesson + dir;
  if(next < 0 || next >= currentModule.lessons.length) return;
  currentLesson = next;
  renderSidebar();
  renderLesson();
}

function toggleComplete(){
  const key = currentModule.key + '-' + currentLesson;
  completed[key] = !completed[key];
  renderSidebar();
  renderLesson();
}

renderGrid();
</script>

</body>
</html>
