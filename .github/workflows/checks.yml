# Checks every pull request before it can go live: the app builds, lint passes, and every page lays out correctly
# on a phone and a desktop in each regular theme (tests/e2e/layout.mjs, against the demo agency's data, no network).
name: Checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Layout check (phone + desktop, every page)
        run: npm run test:layout
      - name: Parity check (rebuilt screens match the originals)
        run: npm run test:parity
      - name: Browser data is saved to the database and cleared at sign-out
        run: npm run test:sync
